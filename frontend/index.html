<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Maple Prints | Premium Mono Cartons, Rigid Boxes & Pharma Packaging – Baddi, India</title>
    <meta
      name="description"
      content="Maple Prints (Baddi, Himachal Pradesh) manufactures premium mono cartons, rigid boxes, pharma, cosmetic, FMCG & corrugated packaging with precision offset printing, foiling, embossing & spot UV."
    />
    <meta
      name="keywords"
      content="Maple Prints, mono cartons Baddi, pharma packaging India, rigid boxes, cosmetic packaging, FMCG cartons, corrugated boxes, offset printing Himachal Pradesh"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Maple Prints" />
    <meta name="theme-color" content="#0A1A3A" />
    <link rel="canonical" href="https://www.mapleprints.in/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maple Prints" />
    <meta property="og:title" content="Maple Prints | Premium Packaging & Printing Solutions" />
    <meta
      property="og:description"
      content="Premium mono cartons, rigid boxes and luxury paper-based packaging with precision printing and finishing. Trusted by leading pharma & FMCG brands."
    />
    <meta property="og:url" content="https://www.mapleprints.in/" />
    <meta property="og:image" content="https://www.mapleprints.in/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Maple Prints | Premium Packaging & Printing Solutions" />
    <meta
      name="twitter:description"
      content="Mono cartons, rigid boxes, pharma & cosmetic packaging manufactured in Baddi, India with world-class print finishing."
    />
    <meta name="twitter:image" content="https://www.mapleprints.in/og-cover.jpg" />

    <!-- Geo (local SEO – update lat/long if needed) -->
    <meta name="geo.region" content="IN-HP" />
    <meta name="geo.placename" content="Baddi, Himachal Pradesh" />

    <!-- Structured data: Organization + WebSite (helps Google Knowledge Panel / Sitelinks) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Maple Prints",
        "url": "https://www.mapleprints.in/",
        "logo": "https://www.mapleprints.in/favicon.svg",
        "description": "Manufacturer of premium mono cartons, rigid boxes and printed paper-based packaging in Baddi, Himachal Pradesh, India.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Baddi",
          "addressRegion": "Himachal Pradesh",
          "addressCountry": "IN"
        },
        "sameAs": []
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Maple Prints",
        "url": "https://www.mapleprints.in/"
      }
    </script>
